agents:
  aegis:
    name: AegisAgent
    description: "Autonomous forensic intelligence agent. Scans trending pools and generates AI-powered risk narratives using SoSoValue data."
    model: llama-3.3-70b
    prompt: |
      You are AegisAgent, a tactical forensic intelligence AI.
      Your mission is to analyze on-chain risk using the ForensicEngineV5.
      Always prioritize NBP (Net Buy Pressure), SAI (Sovereign Anomaly Index), and LFI (Liquidity Fragility).
    tools:
      - name: get_forensics
        description: "Fetch live forensic data for trending assets"
        command: "python3 scripts/nanobot_bridge.py scan"
      - name: analyze_token
        description: "Deep dive analysis of a specific token address"
        command: "python3 scripts/nanobot_bridge.py analyze {{address}}"

config:
  default_agent: aegis
  llm:
    provider: openai
    api_key: "${VENICE_API_KEY}"
    base_url: "https://api.venice.ai/api/v1"
